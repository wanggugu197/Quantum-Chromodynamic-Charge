jei = { group = "mezz.jei", name = "jei-1.21.1-neoforge", version.ref = "jei" }
# https://modrinth.com/mod/jade/versions
jade = { group = "maven.modrinth", name = "jade", version.ref = "jade" }

# https://maven.firstdark.dev/#/snapshots/com/lowdragmc/ldlib2/ldlib2-neoforge-1.21.1
