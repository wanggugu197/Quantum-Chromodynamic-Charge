publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }

    repositories {
        maven {
            name = 'gtodysseyRepository'
            url = 'https://maven.gtodyssey.com/releases'
            credentials {
                username = findProperty('gtodysseyRepositoryUsername')
                password = findProperty('gtodysseyRepositoryPassword')
            }
        }
        // Add repositories to publish to here.
        maven {
            credentials {
                username = System.getenv("MAVEN_USER")
                password = System.getenv("MAVEN_PASSWORD")
            }
        }
    }
}

gtoPublish {
    publishMaven = true
    publishGithub = false
    publishCurseforge = true

    mavenRepoUrl = 'releases'

    minecraftVersion = '26.1.2'
    modLoader = 'NeoForge'

    githubRepo = 'wanggugu197/Quantum-Chromodynamic-Charge'

    curseforgeProjectId = '1622085'
    curseforgeJavaVersion = 'Java 25'
    curseforgeEnvironment = 'both'
}
